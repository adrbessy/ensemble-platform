<!-- 🔙 Flèche de retour -->
<a routerLink="/events" class="btn btn-link position-absolute top-0 start-0 m-3">
  <i class="bi bi-arrow-left fs-4 text-dark"></i>
</a>

<div class="container text-center mt-4">
  <img [src]="'http://localhost:8080/uploads/photos/' + user.photoFilename"
       alt="avatar"
       class="rounded-circle mb-3"
       width="120" height="120"
       onerror="this.src='assets/default-avatar.png'" />

  <h2>{{ user.firstName }} {{ user.lastName }}</h2>

  <p><strong>Date de naissance :</strong> {{ user.birthDate | date:'dd/MM/yyyy' }}</p>
  <p><strong>Genre :</strong> {{ user.gender }}</p>

  <!-- Stats -->
  <div class="d-flex justify-content-center gap-4 my-3">
    <div><strong>{{ 0 }}</strong><br/>Événements participés</div>
    <div><strong>{{ 0 }}</strong><br/>Événements organisés</div>
    <div><strong>{{ 0 }}</strong><br/>Contacts</div>
  </div>

  <button class="btn btn-warning mb-2" (click)="changePassword()">Changer mon mot de passe</button><br/>
  <button class="btn btn-danger" (click)="logout()">Se déconnecter</button>

  <div class="mt-3 text-danger text-center" style="cursor: pointer;" (click)="confirmDelete()">
    Supprimer mon compte
  </div>
</div>
