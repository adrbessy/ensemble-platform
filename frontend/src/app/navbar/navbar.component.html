<nav class="navbar bg-light-yellow px-4 py-2 shadow-sm">
  <div class="container-fluid d-flex justify-content-between align-items-center flex-wrap">
    <!-- Logo -->
    <a class="navbar-brand fw-bold text-dark fs-4" routerLink="/events">Chill and Go</a>

      <ul class="navbar-nav d-flex flex-row align-items-center gap-3 mb-0">
        
        <!-- Non connecté -->
        <ng-container *ngIf="!isLoggedIn()">
          <li class="nav-item" routerLinkActive="active">
            <a class="nav-link" routerLink="/login">Connexion</a>
          </li>
          <li class="nav-item" routerLinkActive="active">
            <a class="nav-link" routerLink="/signup">Inscription</a>
          </li>
        </ng-container>

        <!-- Connecté -->
        <ng-container *ngIf="isLoggedIn()">
          <li class="nav-item" routerLinkActive="active">
            <a class="nav-link" routerLink="/events">
               Activités
            </a>
          </li>
          <li class="nav-item" routerLinkActive="active">
            <a class="nav-link" routerLink="/create-event">
              Créer une activité
            </a>
          </li>
          <li class="nav-item" routerLinkActive="active">
            <a class="nav-link position-relative" routerLink="/messagerie" title="Messagerie">
              <i class="bi bi-chat-dots"></i>
            </a>
          </li>

          <!-- Avatar + nom -->
           
          <li class="nav-item d-flex align-items-center">
            <a [routerLink]="['/mon-profil']" class="nav-link p-0">
              <img
                *ngIf="user?.photoFilename"
                [src]="'http://localhost:8080/uploads/photos/' + user.photoFilename + '?t=' + timestamp"
                alt="Profil"
                class="rounded-circle"
                width="36"
                height="36"
                style="object-fit: cover; border: 2px solid #ccc;"
                onerror="this.src='assets/default-avatar.png'"
              />
            </a>
          </li>


        </ng-container>
      </ul>
  </div>
</nav>
