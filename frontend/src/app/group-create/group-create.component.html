<div class="card p-4 mx-auto" style="max-width: 500px;">
  <h3>Créer un groupe</h3>
  <form (ngSubmit)="submitForm()">
    <div class="mb-3">
      <label class="form-label">Nom du groupe</label>
      <input type="text" class="form-control" [(ngModel)]="name" name="name" required />
    </div>

    <div class="mb-3 form-check">
      <input type="checkbox" class="form-check-input" [(ngModel)]="isPrivate" name="isPrivate" id="privateCheck" />
      <label class="form-check-label" for="privateCheck">Groupe privé</label>
    </div>

    <button type="submit" class="btn btn-primary">Créer</button>
  </form>

  <div *ngIf="successMessage" class="alert alert-success mt-3">
    Groupe créé avec succès !
  </div>
</div>
