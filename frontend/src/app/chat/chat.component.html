<div class="chat-container">
  <!-- Liste des conversations -->
  <div class="sidebar">
    <h5 class="fw-bold mb-3">Discussions</h5>

    <div class="conversation" 
    *ngFor="let conv of conversations" 
    [class.active]="conv.id === selectedConv?.id"
    (click)="selectConversation(conv)">
      <div class="avatar">
        <img 
          *ngIf="conv.photoFilename"
          [src]="'http://localhost:8080/uploads/photos/' + conv.photoFilename"
          (error)="this.src='assets/default-avatar.png'"
          class="rounded-circle"
          width="40"
          height="40"
          alt="avatar" />
      </div>
      <div class="info">
        <div class="name">{{ conv.name }}</div>
        <div class="last-message">{{ conv.lastMessage }}</div>
      </div>
    </div>

  </div>

  <!-- Zone de messages -->
  <div class="chat-box">
    <div class="header d-flex justify-content-between align-items-center">
      <div class="fw-bold">{{ selectedConv?.name }}</div>
    </div>

    <div class="messages" #messagesContainer *ngIf="currentUserId">
      <div *ngFor="let msg of selectedConv?.messages" 
          [class.mine]="msg.sender.id === currentUserId" 
          class="message">
        <span>{{ msg.content }}</span>
        <small class="text-muted">{{ msg.timestamp | date:'shortTime' }}</small>
      </div>
    </div>


<div class="input-area">
  <input [(ngModel)]="newMessage" (keydown.enter)="sendMessage()" placeholder="Écrivez un message..." />
  <button (click)="sendMessage()" class="btn btn-primary">Envoyer</button>

<div class="emoji-wrapper">
  <button #emojiButton (click)="showEmojiPicker = !showEmojiPicker">😊</button>
  <div *ngIf="showEmojiPicker" #emojiPicker class="emoji-picker-container">
    <emoji-mart 
      set="apple" 
      theme="light" 
      (emojiSelect)="addEmoji($event)">
    </emoji-mart>
  </div>
</div>


</div>



  </div>
</div>
